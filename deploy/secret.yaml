apiVersion: v1
kind: Secret
metadata:
  name: kextant-secrets
  namespace: kextant
  labels:
    app.kubernetes.io/name: kextant
type: Opaque
stringData:
  # Kextant Cloud cluster API key. Required only when KEXTANT_CLOUD_ENABLED=true or --upload is used.
  KEXTANT_CLOUD_API_KEY: ""

  # Slack webhook URL (optional local delivery target)
  SLACK_WEBHOOK_URL: ""

  # SMTP credentials (optional local email delivery target)
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
