apiVersion: apps/v1
kind: Deployment
metadata:
  name: kextant-agent
  namespace: kextant
  labels:
    app.kubernetes.io/name: kextant
    app.kubernetes.io/component: agent
  annotations:
    kextant.com/skip-checks: "REP001"  # Single replica acceptable for this monitoring component
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kextant
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kextant
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: kextant-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: ghcr.io/kextant/kextant-agent:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: kextant-config
            - secretRef:
                name: kextant-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
