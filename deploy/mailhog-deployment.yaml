apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: kextant
  labels:
    app: mailhog
  annotations:
    kextant.com/skip-checks: "REP001,IMG001"  # Dev tool: single replica and :latest tag acceptable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:latest
        ports:
        - containerPort: 1025
          name: smtp
        - containerPort: 8025
          name: http
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /
            port: 8025
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: 8025
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8025
          initialDelaySeconds: 2
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: smtp
  namespace: kextant
spec:
  ports:
  - port: 1025
    targetPort: 1025
  selector:
    app: mailhog
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kextant
spec:
  ports:
  - port: 8025
    targetPort: 8025
  selector:
    app: mailhog
  type: LoadBalancer