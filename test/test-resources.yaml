---
# Test resources for Kextant Agent functional testing
# Each deployment is designed to trigger EXACTLY ONE specific check
# All other aspects follow best practices to avoid triggering other checks

apiVersion: v1
kind: Namespace
metadata:
  name: kextant-agent-test
  labels:
    test: "kextant-agent"
    purpose: "functional-testing"

---
# RES001: Missing CPU requests (ONLY this check should fail)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-cpu-requests
  namespace: kextant-agent-test
  labels:
    test-case: "RES001"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-cpu-requests
  template:
    metadata:
      labels:
        app: missing-cpu-requests
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: app
        image: nginx:1.25.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            # Missing CPU request - THIS IS THE TEST
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
        volumeMounts:
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}

